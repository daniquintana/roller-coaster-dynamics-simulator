name: Numerical verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run numerical regression tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v
      - name: Run preliminary assessment smoke test
        env:
          MPLBACKEND: Agg
        run: >-
          python preliminary_engineering_assessment.py
          --output-directory assessment_output
          --cases 5
